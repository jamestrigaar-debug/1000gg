<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<title>Football Manager DNA — Draft a manager, survive your boardroom</title>
<meta name="description" content="A free, browser-based football management simulator. Draft a manager from the DNA of the greats, take whatever job will have you, and survive your boardroom season.">
<style>
  /* Design tokens lifted from 1000goals (../index.html) so the two games read
     as one family. Do not drift these — if the parent site retunes its palette,
     retune here to match. */
  :root {
    --bg: #04120b;
    --bg2: #0a1f15;
    --card: #0f2b1d;
    --card2: #163a27;
    --line: #1e4d35;
    --txt: #f4fff8;
    --muted: #7b9b8b;
    --accent: #00d06c;
    --accent2: #38b6ff;
    --gold: #f5e050;
    --rare: #c47bff;
    --bad: #ff6b7a;
    --radius: 12px;
    --shadow: 0 2px 8px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Arial Narrow", sans-serif;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 4px),
      radial-gradient(1200px 600px at 50% -10%, #0d3d25 0%, var(--bg) 60%);
    color: var(--txt);
    min-height: 100vh;
    line-height: 1.45;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 16px 14px 100px; }
  .screen { display: none; animation: fade .25s ease; }
  .screen.active { display: block; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  h1, h2, h3 { margin: 0 0 .4em; }
  .muted { color: var(--muted); }
  .accent { color: var(--accent); }
  .gold { color: var(--gold); }
  .bad { color: var(--bad); }
  @media (max-width: 600px) { .wrap { padding: 12px 12px 120px; } }

  .btn {
    display: inline-block; border: 1px solid var(--line); background: var(--card2);
    color: var(--txt); padding: 11px 18px; border-radius: 8px; font-size: 14px;
    font-weight: 600; cursor: pointer; text-decoration: none; font-family: inherit;
    transition: background .12s, border-color .12s;
  }
  .btn:hover { background: #24304a; border-color: var(--accent2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: transparent; color: #052211; }
  .btn.primary:hover { background: #4ce29a; }
  .btn.ghost { background: transparent; }
  .btn.danger { border-color: var(--bad); color: var(--bad); }
  .btn.big { font-size: 16px; padding: 14px 26px; }
  .btn.tiny { font-size: 11px; padding: 4px 9px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type=text] { background: var(--bg2); border: 1px solid var(--line); color: var(--txt); padding: 10px; border-radius: 8px; font-size: 14px; font-family: inherit; }

  /* ---------- Welcome ---------- */
  .hero { text-align: center; padding: 48px 14px; }
  .hero h1 {
    font-size: clamp(34px, 6.4vw, 64px); letter-spacing: 2px; line-height: .95;
    font-family: Impact, "Arial Black", "Helvetica Neue", sans-serif; text-transform: uppercase;
    color: var(--txt); text-shadow: 3px 3px 0 #1a4a2e;
  }
  .retro-badge { display: inline-block; background: var(--accent2); color: #04223f; font-weight: 800;
    padding: 4px 12px; border-radius: 6px; text-transform: uppercase; letter-spacing: 1px; font-size: 11px; }
  .beta-badge { display: inline-block; background: var(--gold); color: #2a1c00; font-weight: 900;
    padding: 4px 14px; border-radius: 6px; text-transform: uppercase; letter-spacing: 2px; font-size: 11px; margin-left: 8px; }
  .barclays-strip { height: 8px; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--gold)); margin: 16px 0; border-radius: 4px; }
  /* The shared "Football DNA Simulator" mark — one brand, two games. The
     frame/banner pairing is the standard gradient-border trick (a gradient
     background showing through a 2px padding, with a solid card sitting on
     top) since CSS border-image ignores border-radius in most engines. The
     PLAYER/MANAGER badge is the only thing that tells the two games apart —
     everything else about the mark is identical on purpose. */
  .dna-frame { max-width: 640px; margin: 0 auto; padding: 2px; border-radius: 20px;
    background: linear-gradient(120deg, var(--accent), var(--gold)); }
  .dna-banner { border-radius: 18px; background: var(--bg); padding: 22px 20px 20px; }
  .dna-tags { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
  .dna-banner h1 { margin: 0; }
  .dna-sub { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .dna-line { flex: 1; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--gold)); opacity: .65; }
  .dna-badge { flex-shrink: 0; border: 1px solid var(--gold); border-radius: 8px; padding: 5px 16px;
    font-weight: 800; letter-spacing: 3px; font-size: 13px; color: var(--accent); white-space: nowrap; }
  .dna-badge::before, .dna-badge::after { content: "★"; color: var(--gold); margin: 0 7px; }
  .hero .sub { font-size: 16px; color: var(--muted); margin-bottom: 8px; }
  .hero .goal { display: inline-block; margin: 14px 0 20px; padding: 8px 16px; border: 1px solid var(--gold);
    color: var(--gold); border-radius: 30px; font-weight: 700; font-size: 14px; }
  .features { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
  .feature { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; width: 240px; text-align: left; }
  .feature b { color: var(--accent2); display: block; margin-bottom: 4px; }
  .feature span { color: var(--muted); font-size: 13px; }
  .how-to-play { max-width: 460px; margin: 26px auto 0; text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 2px 14px; }
  .how-to-play summary { cursor: pointer; padding: 10px 0; font-weight: 700; color: var(--accent2); list-style: none; }
  .how-to-play summary::-webkit-details-marker { display: none; }
  .how-to-play summary::before { content: "▸ "; }
  .how-to-play[open] summary::before { content: "▾ "; }
  .how-to-play ol { margin: 0 0 12px; padding-left: 20px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .how-to-play li strong { color: var(--txt); }
  .welcome-footer { margin-top: 34px; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; }
  .footer-link { color: var(--accent2); text-decoration: none; font-weight: 600; font-size: 15px; }
  .footer-link:hover { color: var(--accent); text-decoration: underline; }

  /* ---------- Draft ---------- */
  .genesis-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .pill { background: var(--card); border: 1px solid var(--line); padding: 6px 12px; border-radius: 30px; font-weight: 700; font-size: 13px; }
  .reel { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--accent2);
    border-radius: 12px; padding: 24px; text-align: center; box-shadow: var(--shadow); margin-bottom: 14px; }
  .reel.legendary { border-color: var(--gold); box-shadow: 0 0 24px rgba(245,224,80,.22); }
  .reel.rare { border-color: var(--rare); }
  .reel-rarity { display: inline-block; font-size: 11px; letter-spacing: 2px; color: var(--accent2);
    border: 1px solid var(--accent2); padding: 2px 10px; border-radius: 20px; margin-bottom: 12px; }
  .reel.legendary .reel-rarity { color: var(--gold); border-color: var(--gold); }
  .reel.rare .reel-rarity { color: var(--rare); border-color: var(--rare); }
  .reel-headline { font-size: 30px; font-weight: 900; margin-bottom: 2px; }
  .reel-sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .reel-blurb { color: var(--muted); max-width: 560px; margin: 0 auto 16px; }
  .reel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .reel-grid div { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .reel-grid span { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .attr-bars { max-width: 440px; margin: 0 auto; text-align: left; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 28px; gap: 8px; align-items: center; font-size: 12px; margin-bottom: 5px; }
  .bar { background: var(--bg2); height: 8px; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); }

  /* ---------- Macro Sliders & Competition Focus ---------- */
  .macro-slider {
    margin-bottom: 14px;
  }
  .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .slider-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--txt);
  }
  .slider-value {
    font-size: 13px;
    font-weight: 900;
    color: var(--accent2);
    min-width: 30px;
    text-align: right;
  }
  .slider-track {
    margin-bottom: 6px;
  }
  .slider-input {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 8px;
    border-radius: 4px;
    background: var(--bg2);
    outline: none;
    cursor: pointer;
  }
  .slider-input::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent2);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(56, 182, 255, 0.4);
    transition: box-shadow 0.12s;
  }
  .slider-input::-webkit-slider-thumb:hover {
    box-shadow: 0 2px 12px rgba(56, 182, 255, 0.6);
  }
  .slider-input::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent2);
    cursor: pointer;
    border: 0;
    box-shadow: 0 2px 6px rgba(56, 182, 255, 0.4);
    transition: box-shadow 0.12s;
  }
  .slider-input::-moz-range-thumb:hover {
    box-shadow: 0 2px 12px rgba(56, 182, 255, 0.6);
  }
  .slider-input::-moz-range-track {
    background: transparent;
    border: 0;
  }
  .slider-input::-moz-range-progress {
    background: var(--accent);
    height: 8px;
    border-radius: 4px;
  }
  .slider-labels {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .slider-low,
  .slider-high {
    font-size: 11px;
    color: var(--muted);
    flex: 1;
  }
  .slider-high {
    text-align: right;
  }
  
  .competition-focus {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .comp-row {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 12px;
    align-items: center;
  }
  .comp-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .comp-buttons {
    display: flex;
    gap: 6px;
  }
  .comp-buttons .btn {
    flex: 1;
    font-size: 11px;
    padding: 8px 12px;
  }
  .btn.on {
    color: var(--txt);
    border-color: var(--accent);
    background: var(--card2);
  }

  /* Rest of existing styles continue below... */
</style>
</head>
<body>
<div class="wrap">
  <!-- Content continues in main index.html -->
</div>

<!-- Macro Slider Dependencies -->
<script src="src/macro_sliders.js"></script>
<script src="src/competition_focus.js"></script>
<script src="src/macro_ui.js"></script>

</body>
</html>
