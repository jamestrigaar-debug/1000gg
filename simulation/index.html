<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Match Engine — Match Day</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #161b22;
        --line: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #3fb950;
        --home: #d11f2a;
        --away: #1746a2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .score { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 20px; min-width: 60px; text-align: center; }
      .team { font-weight: 600; letter-spacing: 0.04em; }
      .spacer { flex: 1; }
      .muted { color: var(--muted); }
      .hidden { display: none !important; }
      button {
        background: #21262d; color: var(--text); border: 1px solid var(--line);
        border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer;
      }
      button:hover { background: #2d333b; }
      button[disabled] { opacity: 0.45; cursor: default; }
      button.on { border-color: var(--accent); color: var(--accent); }
      #kickoff { border-color: var(--accent); color: var(--accent); font-weight: 600; }

      main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
      .left { min-height: 0; overflow-y: auto; padding: 14px; }
      aside {
        background: var(--panel); border-left: 1px solid var(--line);
        padding: 10px; overflow-y: auto; font-size: 13px; min-height: 0;
      }

      /* pre-match */
      .pm-grid { display: grid; grid-template-columns: 1fr 220px 1fr; gap: 16px; }
      .pm-team h2 { margin: 0 0 2px; font-size: 18px; }
      .pm-team.away { text-align: right; }
      .pm-shape { font-weight: 600; color: var(--accent); font-size: 13px; }
      .pm-blurb { font-size: 12px; margin-top: 2px; }
      .pm-lineup { list-style: none; margin: 10px 0; padding: 0; font-size: 12.5px; }
      .pm-lineup li { display: flex; gap: 8px; padding: 2px 0; border-bottom: 1px solid #21262d; }
      .pm-team.away .pm-lineup li { flex-direction: row-reverse; }
      .pm-lineup .num { width: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .pm-lineup .pos { width: 26px; color: var(--muted); }
      .pm-lineup .nm { flex: 1; }
      .pm-lineup .rt { font-variant-numeric: tabular-nums; color: var(--accent); }
      .pm-keys { font-size: 12px; margin-bottom: 6px; }
      .pm-traits { display: flex; flex-wrap: wrap; gap: 4px; }
      .pm-team.away .pm-traits { justify-content: flex-end; }
      .tag { font-size: 11px; border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px; color: var(--muted); }
      .pm-middle { align-self: start; padding-top: 24px; }
      .pm-bar { margin-bottom: 10px; }
      .pm-bar-label { display: flex; justify-content: space-between; font-size: 12px; font-variant-numeric: tabular-nums; }
      .pm-bar-track { height: 6px; background: var(--away); border-radius: 3px; overflow: hidden; }
      .pm-bar-fill { height: 100%; background: var(--home); }
      .pm-odds { display: flex; justify-content: space-between; font-size: 12px; margin-top: 14px; font-variant-numeric: tabular-nums; }
      .pm-points { font-size: 12.5px; color: var(--muted); margin-top: 14px; padding-left: 18px; }
      #prematch.collapsed .pm-lineup, #prematch.collapsed .pm-keys { display: none; }

      /* progress */
      #sim-bar { height: 4px; background: #21262d; border-radius: 2px; margin: 10px 0; overflow: hidden; }
      #sim-progress { height: 100%; width: 0; background: var(--accent); transition: width 0.2s linear; }

      /* highlight reel */
      .hl {
        display: flex; gap: 8px; width: 100%; text-align: left; align-items: baseline;
        background: transparent; border: 0; border-bottom: 1px solid #21262d;
        border-radius: 0; padding: 6px 4px; color: var(--muted);
      }
      .hl:hover { background: #1c2129; }
      .hl.mid { color: var(--text); }
      .hl.big { color: var(--text); font-weight: 600; }
      .hl.playing { background: #1f2a20; box-shadow: inset 2px 0 0 var(--accent); }
      .hl-min { width: 30px; font-variant-numeric: tabular-nums; color: var(--muted); }
      .hl-text { flex: 1; }
      .hl-score { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }

      /* pitch */
      #stage-wrap { margin-bottom: 12px; }
      #stage { position: relative; height: 58vh; min-height: 320px; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; }
      #stage canvas { display: block; }
      .watch-strip { display: flex; gap: 10px; align-items: center; padding: 6px 2px; font-size: 13px; }

      .stat-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
      .stat-table td, .stat-table th { padding: 3px 4px; font-weight: 400; font-variant-numeric: tabular-nums; }
      .stat-table th { color: var(--muted); text-align: center; font-size: 12px; }
      .stat-table td:first-child { text-align: left; }
      .stat-table td:last-child { text-align: right; }
      .ratings { list-style: none; padding: 0; margin: 4px 0 0; }
      .ratings li { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid #21262d; }
      h3 { font-size: 13px; margin: 14px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    </style>
  </head>
  <body>
    <header>
      <span class="team" id="home-name">HOME</span>
      <span class="score" id="score">v</span>
      <span class="team" id="away-name">AWAY</span>
      <span class="muted" id="status"></span>
      <span class="spacer"></span>
      <button id="kickoff">Simulate match</button>
      <span class="muted">Highlights:</span>
      <button id="mode-key">Key</button>
      <button id="mode-extended" class="on">Extended</button>
      <button id="mode-comprehensive">Comprehensive</button>
      <button id="mode-full">Full</button>
    </header>
    <main>
      <div class="left">
        <div id="stage-wrap" class="hidden">
          <div id="stage"></div>
          <div class="watch-strip">
            <span id="watch-clock" class="muted">00:00</span>
            <span id="watch-caption"></span>
            <span class="spacer"></span>
            <button id="speed-1">1&times;</button>
            <button id="speed-2">2&times;</button>
            <button id="speed-4">4&times;</button>
            <button id="names" data-on="true" class="on">Names</button>
            <button id="camera" data-mode="fit">Camera: pitch</button>
            <button id="flip" data-o="horizontal">Flip</button>
          </div>
        </div>
        <div id="sim-bar" class="hidden"><div id="sim-progress"></div></div>
        <div id="prematch"></div>
      </div>
      <aside>
        <h3>The match</h3>
        <div class="muted" id="reel-summary">Simulate the match to see the highlights.</div>
        <div id="feed"></div>
        <div id="stats"></div>
      </aside>
    </main>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
