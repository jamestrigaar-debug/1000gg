<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EndlessQuest</title>
  <style>
    /*
      Chrome for a glyph-grid roguelike. The reference games are dense, monospaced, and
      unapologetically textual; the departure here is the palette, which is ink on
      near-black rather than the sixteen DOS colours, and bars drawn as glyph runs
      rather than as CSS fills.
    */
    :root {
      --void: #05060a;
      --panel: #0a0c11;
      --rule: #1c2028;
      --bone: #d8d0c0;
      --ash: #8a857c;
      --iron: #5f6670;
      --moss: #6b7a4a;
      --rust: #8a5a3c;
      --ember: #c8752c;
      --blood: #8c2f2f;
      --pale: #b6c2c9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--void);
      color: var(--bone);
      font-family: Consolas, "DejaVu Sans Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.35;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: none;
    }
    #status-bar {
      background: var(--panel);
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: stretch;
      gap: 18px;
      padding: 6px 12px;
      font-size: 12px;
      white-space: nowrap;
      overflow-x: auto;
    }
    /*
      Four columns, and nothing folded away inside any of them.

      The old layout was a full-bleed map with one narrow scrolling column beside it that
      held the speak line, the actions, the people, the worn kit and the carried kit in
      that order -- which meant the inventory was permanently below the fold, and the map,
      the least informative thing on screen, had most of the screen. This is the other way
      around: the board is a small window onto where you are standing, the narration takes
      the middle because this is a game made of prose, and what you are carrying has a
      column of its own that never scrolls out of sight.
    */
    #main-area {
      flex: 1;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 240px 250px;
      overflow: hidden;
    }
    #main-area > * { min-width: 0; overflow: hidden; }

    #left-column {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--rule);
      overflow: hidden;
    }
    #map-container {
      height: 288px;
      transition: height 0.12s;
      flex: none;
      position: relative;
      background: var(--void);
      overflow: hidden;
      border-bottom: 1px solid var(--rule);
    }
    #here-panel, #movement-panel {
      padding: 7px 10px;
      overflow-y: auto;
    }
    #movement-panel { flex: none; }
    #here-panel { flex: 1; border-top: 1px solid var(--rule); }

    #narrative-column {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--void);
    }
    #speak-bar {
      flex: none;
      border-top: 1px solid var(--rule);
      background: var(--panel);
      padding: 7px 10px;
    }

    #character-panel {
      background: var(--panel);
      border-left: 1px solid var(--rule);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
    }
    /* The chart covers the whole window: the map column is far too small to read it in. */
    #chart-overlay {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(4, 5, 7, 0.94);
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; padding: 14px; overflow: auto; cursor: pointer;
    }
    #chart-overlay[hidden] { display: none; }
    #chart-overlay h3 { margin: 0; color: var(--bone); letter-spacing: 0.14em; text-transform: uppercase; font-size: 11px; }
    #chart-overlay canvas { image-rendering: pixelated; border: 1px solid #1c2028; max-width: 100%; }
    .chart-legend { display: flex; flex-direction: column; gap: 2px; text-align: center; }
    .chart-place { margin: 0; color: var(--bone); font-size: 11px; }
    #action-panel {
      background: var(--panel);
      border-left: 1px solid var(--rule);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
    }
    #action-panel h3, #character-panel h3, #here-panel h3, #movement-panel h3, #speak-bar h3 {
      font-size: 11px;
      font-weight: normal;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--moss);
      margin: 10px 0 3px;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 2px;
    }
    #action-panel h3:first-child, #character-panel h3:first-child,
    #here-panel h3:first-child, #movement-panel h3:first-child,
    #speak-bar h3:first-child { margin-top: 0; }
    #action-panel h3.panel-danger, #here-panel h3.panel-danger { color: var(--blood); }
    #action-panel h3.panel-dead { color: #5e1616; }
    #speak {
      width: 100%; box-sizing: border-box;
      background: #0b0d10; color: var(--bone);
      border: 1px solid #2a2f38; border-radius: 2px;
      padding: 6px 8px; font: inherit; font-size: 12px;
    }
    #speak::placeholder { color: #4a505c; }
    #repertoire { margin-top: 4px; }
    #repertoire summary {
      cursor: pointer; color: var(--iron); font-size: 9.5px;
      letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 0;
    }
    #repertoire summary:hover { color: var(--bone); }
    .verb-group { display: flex; flex-wrap: wrap; gap: 3px; align-items: baseline; margin-bottom: 3px; }
    .verb-group-label {
      color: #4a505c; font-size: 9px; text-transform: uppercase;
      letter-spacing: 0.1em; width: 100%; margin-top: 3px;
    }
    button.verb {
      background: #101318; color: var(--ash, #8a857c);
      border: 1px solid #23272f; border-radius: 2px;
      padding: 2px 6px; font: inherit; font-size: 10.5px; cursor: pointer;
      width: auto; margin: 0;
    }
    .condition {
      display: flex; flex-direction: column; gap: 1px; margin-bottom: 6px;
      border-left: 2px solid var(--blood); padding-left: 7px;
    }
    .condition-name { color: var(--blood); font-size: 11.5px; }
    .condition-effect { color: var(--ash); font-size: 10px; }
    .condition-cure { color: var(--iron); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; }
    .errand { display: flex; flex-direction: column; gap: 1px; margin-bottom: 5px; }
    .errand-task { color: var(--bone); font-size: 11.5px; }
    .errand-who { color: var(--iron); font-size: 9.5px; }
    .errand.urgent .errand-task { color: var(--ember); }
    .person { display: flex; flex-direction: column; gap: 1px; margin-bottom: 4px; }
    .person-name { color: var(--bone); font-size: 11.5px; }
    .person-note { color: var(--iron); font-size: 9.5px; }
    .person-ideal { color: var(--bile, #7a7040); font-size: 9.5px; font-style: italic; }
    button.verb:hover { color: var(--bone); border-color: var(--ember); background: #161a20; }
    #speak:focus { outline: none; border-color: var(--ember); }
    #log-panel .log-entry.said { color: var(--pale, #b6c2c9); font-weight: bold; }
    #action-panel h3.panel-won  { color: #b8a878; }
    #action-panel button, #character-panel button, #here-panel button, #movement-panel button {
      background: transparent;
      color: var(--bone);
      border: 1px solid var(--rule);
      padding: 4px 7px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      text-align: left;
      transition: background 0.08s, border-color 0.08s;
    }
    #action-panel button:hover:not(:disabled), #character-panel button:hover:not(:disabled),
    #here-panel button:hover:not(:disabled), #movement-panel button:hover:not(:disabled) {
      background: #141821;
      border-color: var(--moss);
      color: #fff;
    }
    #action-panel button:disabled, #character-panel button:disabled,
    #here-panel button:disabled, #movement-panel button:disabled { opacity: 0.32; cursor: not-allowed; }
    #action-panel .panel-note, #character-panel .panel-note, #here-panel .panel-note,
    #movement-panel .panel-note, #speak-bar .panel-note {
      font-size: 11px;
      color: var(--ash);
      margin: 1px 0 4px;
    }
    #movement-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      margin-bottom: 6px;
    }
    /* The rooms of a place, since the board is no use under a hill. */
    .room-plan { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .room-plan .room {
      width: 18px; height: 18px; line-height: 18px; text-align: center;
      border: 1px solid var(--rule); font-size: 11px;
    }
    .room-plan .room.here { color: var(--ember); border-color: var(--ember); }
    .room-plan .room.walked { color: var(--ash); }
    .room-plan .room.dark { color: #2a2f38; }
    .aim-row { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin: 3px 0; }
    .aim-row button { font-size: 10.5px; padding: 3px 5px; }
    .march-row { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-bottom: 4px; }
    button.place { display: flex; flex-direction: column; gap: 1px; margin-bottom: 3px; }
    .place-name { color: var(--bone); font-size: 11.5px; }
    .place-way { color: var(--iron); font-size: 9.5px; }
    button.place:hover .place-name { color: var(--ember); }
    button.place.owed { border-left: 2px solid var(--ember); }
    button.place.owed .place-name { color: var(--ember); }
    #movement-grid { max-width: 168px; }
    #movement-grid button { aspect-ratio: 1; max-height: 54px; text-align: center; padding: 0; font-size: 13px; }
    #log-panel {
      flex: 1;
      background: var(--void);
      padding: 8px 14px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
    }
    #log-panel .log-entry { padding: 1px 0; max-width: 62rem; }
    #log-panel .log-stamp {
      color: #3a4048; font-size: 9.5px; letter-spacing: 0.14em;
      margin: 9px 0 2px; padding-bottom: 2px; border-bottom: 1px solid #12151b;
      max-width: 62rem;
    }
    #log-panel .log-stamp:first-child { margin-top: 0; }
    #log-panel .log-entry.movement { color: var(--ash); }
    #log-panel .log-entry.system   { color: var(--pale); }
    #log-panel .log-entry.search   { color: var(--moss); }
    #log-panel .log-entry.rest     { color: var(--iron); }
    #log-panel .log-entry.combat   { color: var(--ember); }
    #log-panel .log-entry.danger   { color: var(--blood); }
    #log-panel .log-entry.death    { color: #ff4d4d; font-weight: bold; }
    #log-panel .log-entry.error    { color: var(--rust); }

    /* Status bar: label above a glyph-run bar, after the reference games' readouts. */
    .status-item { display: flex; flex-direction: column; gap: 1px; }
    .status-label {
      font-size: 9.5px;
      letter-spacing: 0.12em;
      color: var(--iron);
      text-transform: uppercase;
    }
    .status-value { color: var(--bone); }
    .status-sub { font-size: 9.5px; color: var(--iron); text-transform: capitalize; }
    .meter { letter-spacing: -1px; }
    .meter .full { color: currentColor; }
    .meter .empty { color: #22262e; }
    .meter.hp     { color: var(--blood); }
    .meter.hunger { color: var(--rust); }
    .meter.thirst { color: #3d6b8a; }
    .meter.fatigue{ color: #6a5a80; }
    .meter.mark   { color: var(--ember); }
    .meter.exhaustion { color: var(--rust); }

    .abilities .status-value { display: flex; gap: 8px; flex-wrap: wrap; }
    .ability { color: var(--iron); white-space: nowrap; }
    .ability b { color: var(--bone); font-weight: 600; }
    .threat-glyph { font-weight: bold; font-size: 15px; }
    .mark-value.band-0 { color: var(--iron); }
    .mark-value.band-1 { color: var(--bile, #7a7040); }
    .mark-value.band-2 { color: var(--rust); }
    .mark-value.band-3 { color: var(--blood); }
    .mark-value.band-4 { color: #ff2d2d; text-shadow: 0 0 7px #ff2d2d; }

    /*
      Items as cards.

      The catalog was written as a deck -- every entry has a scarcity, a weight, a worth
      and a line of prose about what holding it is like -- and a list of nouns with a
      multiplication sign after them throws all of that away. A card keeps it, and it is
      the same card whether it is being chosen at embark or carried on the road.
    */
    .card-column { display: flex; flex-direction: column; gap: 5px; }
    .card-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .item-card {
      display: flex; flex-direction: column; gap: 2px;
      background: #0d1015;
      border: 1px solid var(--rule);
      border-left: 2px solid var(--card-ink, var(--iron));
      border-radius: 2px;
      padding: 5px 7px;
      text-align: left;
      font: inherit;
      color: var(--bone);
      cursor: pointer;
      transition: background 0.08s, border-color 0.08s;
    }
    .card-row .item-card { width: 190px; cursor: default; }
    button.item-card:hover:not(:disabled) { background: #141821; border-color: var(--ember); }
    button.item-card:disabled { cursor: not-allowed; }
    .item-card.inert, .item-card.in-use { opacity: 0.62; }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
    .card-name { color: var(--card-ink, var(--bone)); font-size: 12px; }
    .card-count { color: var(--iron); font-size: 10px; }
    .card-kind { color: #4a505c; font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; }
    .card-line { color: var(--ash); font-size: 10.5px; line-height: 1.35; }
    .card-stats { display: flex; flex-wrap: wrap; gap: 6px; color: var(--iron); font-size: 9.5px; }
    .card-boon { color: var(--ember); font-size: 9.5px; font-style: italic; }
    .card-footer { color: #4a505c; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }

    /*
      The front door.

      Sits over everything until the player has read the premise and settled who they
      were; then it removes itself and the board is what is left.
    */
    #start-screen {
      position: fixed; inset: 0; z-index: 40;
      background: var(--void);
      overflow-y: auto;
    }
    .screen-inner { max-width: 62rem; margin: 0 auto; padding: 6vh 2rem 4rem; }
    .game-title {
      font-size: 34px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--bone); font-weight: normal; margin-bottom: 4px;
    }
    .game-sub { color: var(--rust); letter-spacing: 0.14em; font-size: 12px; margin-bottom: 2.2rem; }
    .screen-heading {
      font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--bone); font-weight: normal; margin-bottom: 1.4rem;
    }
    .premise p { color: var(--ash); font-size: 14px; line-height: 1.75; margin-bottom: 1rem; max-width: 46rem; }
    .premise em { color: var(--bone); font-style: normal; }
    .how-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); gap: 1.4rem; }
    .how-item h3 {
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--moss); font-weight: normal; margin-bottom: 5px;
    }
    .how-item p { color: var(--ash); font-size: 12px; line-height: 1.65; }
    .pick-heading {
      font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--moss); font-weight: normal; margin: 1.8rem 0 0.7rem;
      border-bottom: 1px solid var(--rule); padding-bottom: 3px;
    }
    .pick-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    button.pick {
      display: flex; flex-direction: column; gap: 5px;
      background: #0a0c11; border: 1px solid var(--rule); border-radius: 2px;
      padding: 10px 12px; text-align: left; font: inherit; color: var(--bone);
      cursor: pointer; transition: border-color 0.08s, background 0.08s;
    }
    button.pick:hover { border-color: var(--iron); background: #0e1116; }
    button.pick.chosen { border-color: var(--ember); background: #14100c; }
    .pick-name { font-size: 14px; letter-spacing: 0.1em; }
    button.pick.chosen .pick-name { color: var(--ember); }
    .pick-role { color: var(--iron); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; }
    .pick-line { color: var(--ash); font-size: 11px; line-height: 1.5; }
    .pick-terms { list-style: none; color: var(--iron); font-size: 10px; line-height: 1.55; }
    .pick-terms li::before { content: '— '; color: #3a4048; }
    .pick-scores { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 2px; }
    .score { color: var(--iron); font-size: 10px; }
    .score b { color: var(--ash); font-weight: 600; }
    .score.best b { color: var(--bone); }
    .loadout-note { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; color: var(--iron); font-size: 11px; }
    .loadout-note b { color: var(--bone); }
    .loadout-dealt { color: #4a505c; font-size: 10.5px; margin-top: 8px; max-width: 42rem; line-height: 1.55; }
    .screen-actions { display: flex; align-items: center; gap: 10px; margin-top: 2.4rem; flex-wrap: wrap; }
    .screen-actions button {
      background: transparent; color: var(--ash); border: 1px solid var(--rule);
      padding: 8px 16px; font: inherit; font-size: 12px; cursor: pointer;
      letter-spacing: 0.1em; text-transform: uppercase; transition: all 0.08s;
    }
    .screen-actions button:hover { color: var(--bone); border-color: var(--iron); }
    .screen-actions button.primary { color: var(--ember); border-color: #4a3620; }
    .screen-actions button.primary:hover { border-color: var(--ember); background: #14100c; }
    .seed-field { margin-left: auto; color: var(--iron); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
    .seed-field input {
      background: #0b0d10; color: var(--ash); border: 1px solid var(--rule);
      padding: 6px 8px; font: inherit; font-size: 11px; margin-left: 8px; width: 11rem;
      text-transform: none; letter-spacing: 0;
    }
    .seed-field input:focus { outline: none; border-color: var(--ember); }

    /*
      Narrow windows tighten the columns and then fold them onto two rows. Nothing is
      ever hidden to make room -- the point of the layout is that the carried kit and the
      narration are both always on screen.
    */
    @media (max-width: 1280px) {
      #main-area { grid-template-columns: 260px minmax(0, 1fr) 210px 215px; }
      #map-container { height: 240px; }
    }
    @media (max-width: 1040px) {
      #main-area {
        grid-template-columns: 250px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1.4fr) minmax(0, 1fr);
        grid-template-areas:
          'left narrative'
          'actions character';
      }
      #left-column { grid-area: left; }
      #narrative-column { grid-area: narrative; }
      #action-panel { grid-area: actions; border-left: none; border-top: 1px solid var(--rule); }
      #character-panel { grid-area: character; border-top: 1px solid var(--rule); }
      #map-container { height: 190px; }
      .pick-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="status-bar"></div>
  <div id="main-area">
    <div id="left-column">
      <div id="map-container"></div>
      <div id="movement-panel"></div>
      <div id="here-panel"></div>
    </div>
    <div id="narrative-column">
      <div id="log-panel"></div>
      <div id="speak-bar"></div>
    </div>
    <div id="action-panel"></div>
    <div id="character-panel"></div>
  </div>
  <!--
    The entry point, as a relative path so that nothing here depends on the game living
    at the root of a domain.
  -->
  <script type="module" src="./src/main.ts"></script>

  <!--
    The boot guard.

    A browser given TypeScript, or a missing bundle, fails silently: the markup and the
    styles above still paint, so the page comes up as a black rectangle with no error
    and nothing to act on. That is what happens when this repository is uploaded to a
    web host as-is, because a web server cannot run src/main.ts the way the dev server
    does -- the game has to be built first.

    So: if the game has not announced itself shortly after load, look for a build beside
    this file and go there. Failing that, say plainly what is wrong and how to fix it,
    which is worth more than a black screen.
  -->
  <script>
    (function () {
      var GRACE_MS = 2000;

      function explain(detail) {
        document.body.innerHTML =
          '<div style="max-width:44rem;margin:12vh auto;padding:0 1.5rem;' +
          'color:#d8d0c0;font:14px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace">' +
          '<h1 style="font-size:15px;letter-spacing:.14em;text-transform:uppercase;' +
          'color:#c8752c;margin:0 0 1rem">EndlessQuest did not start</h1>' +
          '<p style="margin:0 0 1rem">' +
          'This page is the <strong>source</strong> of the game, not the built game. ' +
          'A web server cannot run TypeScript; it has to be compiled first.' +
          '</p>' +
          '<pre style="background:#101318;border:1px solid #23272f;padding:.9rem;' +
          'overflow-x:auto;margin:0 0 1rem">npm install\nnpm run build</pre>' +
          '<p style="margin:0 0 1rem">' +
          'That writes a <code>dist/</code> folder. Upload <em>the contents of ' +
          '<code>dist/</code></em> to this location — not the whole repository. ' +
          'The build uses relative paths, so it runs from any directory.' +
          '</p>' +
          '<p style="color:#5f6670;margin:0">' + detail + '</p>' +
          '</div>';
      }

      window.addEventListener('load', function () {
        window.setTimeout(function () {
          if (window.__ENDLESSQUEST_BOOTED) return;

          // Look for a build beside this file, cheapest and most likely first. The
          // single-file build is tried before the folder because a folder is the thing
          // that goes missing: it has been dropped by a .gitignore once and by an upload
          // once, and one file is harder to lose than one file inside a directory.
          var candidates = ['./EndlessQuest.html', './dist/index.html'];

          function tryNext(i) {
            if (i >= candidates.length) {
              explain('No build found beside this file either.');
              return;
            }
            fetch(candidates[i], { method: 'HEAD' })
              .then(function (response) {
                if (response.ok) {
                  window.location.replace(candidates[i].replace(/index\.html$/, ''));
                  return;
                }
                tryNext(i + 1);
              })
              .catch(function () {
                tryNext(i + 1);
              });
          }

          tryNext(0);
        }, GRACE_MS);
      });
    })();
  </script>
