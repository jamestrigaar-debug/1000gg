<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EndlessQuest</title>
  <style>
    /*
      Chrome for a glyph-grid roguelike. The reference games are dense, monospaced, and
      unapologetically textual; the departure here is the palette, which is ink on
      near-black rather than the sixteen DOS colours, and bars drawn as glyph runs
      rather than as CSS fills.
    */
    :root {
      --void: #05060a;
      --panel: #0a0c11;
      --rule: #1c2028;
      --bone: #d8d0c0;
      --ash: #8a857c;
      --iron: #5f6670;
      --moss: #6b7a4a;
      --rust: #8a5a3c;
      --ember: #c8752c;
      --blood: #8c2f2f;
      --pale: #b6c2c9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--void);
      color: var(--bone);
      font-family: Consolas, "DejaVu Sans Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.35;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: none;
    }
    #status-bar {
      background: var(--panel);
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: stretch;
      gap: 18px;
      padding: 6px 12px;
      font-size: 12px;
      white-space: nowrap;
      overflow-x: auto;
    }
    /*
      Four columns, and nothing folded away inside any of them.

      The old layout was a full-bleed map with one narrow scrolling column beside it that
      held the speak line, the actions, the people, the worn kit and the carried kit in
      that order -- which meant the inventory was permanently below the fold, and the map,
      the least informative thing on screen, had most of the screen. This is the other way
      around: the board is a small window onto where you are standing, the narration takes
      the middle because this is a game made of prose, and what you are carrying has a
      column of its own that never scrolls out of sight.
    */
    #main-area {
      flex: 1;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 240px 250px;
      overflow: hidden;
    }
    #main-area > * { min-width: 0; overflow: hidden; }

    #left-column {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--rule);
      overflow: hidden;
    }
    #map-container {
      height: 288px;
      transition: height 0.12s;
      flex: none;
      position: relative;
      background: var(--void);
      overflow: hidden;
      border-bottom: 1px solid var(--rule);
    }
    #here-panel, #movement-panel {
      padding: 7px 10px;
      overflow-y: auto;
    }
    #movement-panel { flex: none; }
    #here-panel { flex: 1; border-top: 1px solid var(--rule); }

    #narrative-column {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--void);
    }
    #speak-bar {
      flex: none;
      border-top: 1px solid var(--rule);
      background: var(--panel);
      padding: 7px 10px;
    }

    #character-panel {
      background: var(--panel);
      border-left: 1px solid var(--rule);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
    }
    /* The chart covers the whole window: the map column is far too small to read it in. */
    #chart-overlay {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(4, 5, 7, 0.94);
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; padding: 14px; overflow: auto; cursor: pointer;
    }
    #chart-overlay[hidden] { display: none; }
    #chart-overlay h3 { margin: 0; color: var(--bone); letter-spacing: 0.14em; text-transform: uppercase; font-size: 11px; }
    #chart-overlay canvas { image-rendering: pixelated; border: 1px solid #1c2028; max-width: 100%; }
    .chart-legend { display: flex; flex-direction: column; gap: 2px; text-align: center; }
    .chart-place { margin: 0; color: var(--bone); font-size: 11px; }
    #action-panel {
      background: var(--panel);
      border-left: 1px solid var(--rule);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
    }
    #action-panel h3, #character-panel h3, #here-panel h3, #movement-panel h3, #speak-bar h3 {
      font-size: 11px;
      font-weight: normal;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--moss);
      margin: 10px 0 3px;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 2px;
    }
    #action-panel h3:first-child, #character-panel h3:first-child,
    #here-panel h3:first-child, #movement-panel h3:first-child,
    #speak-bar h3:first-child { margin-top: 0; }
    #action-panel h3.panel-danger, #here-panel h3.panel-danger { color: var(--blood); }
    #action-panel h3.panel-dead { color: #5e1616; }
    #speak {
      width: 100%; box-sizing: border-box;
      background: #0b0d10; color: var(--bone);
      border: 1px solid #2a2f38; border-radius: 2px;
      padding: 6px 8px; font: inherit; font-size: 12px;
    }
    #speak::placeholder { color: #4a505c; }
    #repertoire { margin-top: 4px; }
    #repertoire summary {
      cursor: pointer; color: var(--iron); font-size: 9.5px;
      letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 0;
    }
    #repertoire summary:hover { color: var(--bone); }
    .verb-group { display: flex; flex-wrap: wrap; gap: 3px; align-items: baseline; margin-bottom: 3px; }
    .verb-group-label {
      color: #4a505c; font-size: 9px; text-transform: uppercase;
      letter-spacing: 0.1em; width: 100%; margin-top: 3px;
    }
    button.verb {
      background: #101318; color: var(--ash, #8a857c);
      border: 1px solid #23272f; border-radius: 2px;
      padding: 2px 6px; font: inherit; font-size: 10.5px; cursor: pointer;
      width: auto; margin: 0;
    }
    .condition {
      display: flex; flex-direction: column; gap: 1px; margin-bottom: 6px;
      border-left: 2px solid var(--blood); padding-left: 7px;
    }
    .condition-name { color: var(--blood); font-size: 11.5px; }
    .condition-effect { color: var(--ash); font-size: 10px; }
    .condition-cure { color: var(--iron); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; }
    .errand { display: flex; flex-direction: column; gap: 1px; margin-bottom: 5px; }
    .errand-task { color: var(--bone); font-size: 11.5px; }
    .errand-who { color: var(--iron); font-size: 9.5px; }
    .errand.urgent .errand-task { color: var(--ember); }
    .person { display: flex; flex-direction: column; gap: 1px; margin-bottom: 4px; }
    .person-name { color: var(--bone); font-size: 11.5px; }
    .person-note { color: var(--iron); font-size: 9.5px; }
    .person-ideal { color: var(--bile, #7a7040); font-size: 9.5px; font-style: italic; }
    button.verb:hover { color: var(--bone); border-color: var(--ember); background: #161a20; }
    #speak:focus { outline: none; border-color: var(--ember); }
    #log-panel .log-entry.said { color: var(--pale, #b6c2c9); font-weight: bold; }
    #action-panel h3.panel-won  { color: #b8a878; }
    #action-panel button, #character-panel button, #here-panel button, #movement-panel button {
      background: transparent;
      color: var(--bone);
      border: 1px solid var(--rule);
      padding: 4px 7px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      text-align: left;
      transition: background 0.08s, border-color 0.08s;
    }
    #action-panel button:hover:not(:disabled), #character-panel button:hover:not(:disabled),
    #here-panel button:hover:not(:disabled), #movement-panel button:hover:not(:disabled) {
      background: #141821;
      border-color: var(--moss);
      color: #fff;
    }
    #action-panel button:disabled, #character-panel button:disabled,
    #here-panel button:disabled, #movement-panel button:disabled { opacity: 0.32; cursor: not-allowed; }
    #action-panel .panel-note, #character-panel .panel-note, #here-panel .panel-note,
    #movement-panel .panel-note, #speak-bar .panel-note {
      font-size: 11px;
      color: var(--ash);
      margin: 1px 0 4px;
    }
    #movement-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      margin-bottom: 6px;
    }
    /* The rooms of a place, since the board is no use under a hill. */
    .room-plan { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .room-plan .room {
      width: 18px; height: 18px; line-height: 18px; text-align: center;
      border: 1px solid var(--rule); font-size: 11px;
    }
    .room-plan .room.here { color: var(--ember); border-color: var(--ember); }
    .room-plan .room.walked { color: var(--ash); }
    .room-plan .room.dark { color: #2a2f38; }
    .aim-row { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin: 3px 0; }
    .aim-row button { font-size: 10.5px; padding: 3px 5px; }
    .march-row { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-bottom: 4px; }
    button.place { display: flex; flex-direction: column; gap: 1px; margin-bottom: 3px; }
    .place-name { color: var(--bone); font-size: 11.5px; }
    .place-way { color: var(--iron); font-size: 9.5px; }
    button.place:hover .place-name { color: var(--ember); }
    button.place.owed { border-left: 2px solid var(--ember); }
    button.place.owed .place-name { color: var(--ember); }
    #movement-grid { max-width: 168px; }
    #movement-grid button { aspect-ratio: 1; max-height: 54px; text-align: center; padding: 0; font-size: 13px; }
    #log-panel {
      flex: 1;
      background: var(--void);
      padding: 8px 14px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
    }
    #log-panel .log-entry { padding: 1px 0; max-width: 62rem; }
    #log-panel .log-stamp {
      color: #3a4048; font-size: 9.5px; letter-spacing: 0.14em;
      margin: 9px 0 2px; padding-bottom: 2px; border-bottom: 1px solid #12151b;
      max-width: 62rem;
    }
    #log-panel .log-stamp:first-child { margin-top: 0; }
    #log-panel .log-entry.movement { color: var(--ash); }
    #log-panel .log-entry.system   { color: var(--pale); }
    #log-panel .log-entry.search   { color: var(--moss); }
    #log-panel .log-entry.rest     { color: var(--iron); }
    #log-panel .log-entry.combat   { color: var(--ember); }
    #log-panel .log-entry.danger   { color: var(--blood); }
    #log-panel .log-entry.death    { color: #ff4d4d; font-weight: bold; }
    #log-panel .log-entry.error    { color: var(--rust); }

    /* Status bar: label above a glyph-run bar, after the reference games' readouts. */
    .status-item { display: flex; flex-direction: column; gap: 1px; }
    .status-label {
      font-size: 9.5px;
      letter-spacing: 0.12em;
      color: var(--iron);
      text-transform: uppercase;
    }
    .status-value { color: var(--bone); }
    .status-sub { font-size: 9.5px; color: var(--iron); text-transform: capitalize; }
    .meter { letter-spacing: -1px; }
    .meter .full { color: currentColor; }
    .meter .empty { color: #22262e; }
    .meter.hp     { color: var(--blood); }
    .meter.hunger { color: var(--rust); }
    .meter.thirst { color: #3d6b8a; }
    .meter.fatigue{ color: #6a5a80; }
    .meter.mark   { color: var(--ember); }
    .meter.exhaustion { color: var(--rust); }

    .abilities .status-value { display: flex; gap: 8px; flex-wrap: wrap; }
    .ability { color: var(--iron); white-space: nowrap; }
    .ability b { color: var(--bone); font-weight: 600; }
    .threat-glyph { font-weight: bold; font-size: 15px; }
    .mark-value.band-0 { color: var(--iron); }
    .mark-value.band-1 { color: var(--bile, #7a7040); }
    .mark-value.band-2 { color: var(--rust); }
    .mark-value.band-3 { color: var(--blood); }
    .mark-value.band-4 { color: #ff2d2d; text-shadow: 0 0 7px #ff2d2d; }

    /*
      Items as cards.

      The catalog was written as a deck -- every entry has a scarcity, a weight, a worth
      and a line of prose about what holding it is like -- and a list of nouns with a
      multiplication sign after them throws all of that away. A card keeps it, and it is
      the same card whether it is being chosen at embark or carried on the road.
    */
    .card-column { display: flex; flex-direction: column; gap: 5px; }
    .card-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .item-card {
      display: flex; flex-direction: column; gap: 2px;
      background: #0d1015;
      border: 1px solid var(--rule);
      border-left: 2px solid var(--card-ink, var(--iron));
      border-radius: 2px;
      padding: 5px 7px;
      text-align: left;
      font: inherit;
      color: var(--bone);
      cursor: pointer;
      transition: background 0.08s, border-color 0.08s;
    }
    .card-row .item-card { width: 190px; cursor: default; }
    button.item-card:hover:not(:disabled) { background: #141821; border-color: var(--ember); }
    button.item-card:disabled { cursor: not-allowed; }
    .item-card.inert, .item-card.in-use { opacity: 0.62; }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
    .card-name { color: var(--card-ink, var(--bone)); font-size: 12px; }
    .card-count { color: var(--iron); font-size: 10px; }
    .card-kind { color: #4a505c; font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; }
    .card-line { color: var(--ash); font-size: 10.5px; line-height: 1.35; }
    .card-stats { display: flex; flex-wrap: wrap; gap: 6px; color: var(--iron); font-size: 9.5px; }
    .card-boon { color: var(--ember); font-size: 9.5px; font-style: italic; }
    .card-footer { color: #4a505c; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }

    /*
      The front door.

      Sits over everything until the player has read the premise and settled who they
      were; then it removes itself and the board is what is left.
    */
    #start-screen {
      position: fixed; inset: 0; z-index: 40;
      background: var(--void);
      overflow-y: auto;
    }
    .screen-inner { max-width: 62rem; margin: 0 auto; padding: 6vh 2rem 4rem; }
    .game-title {
      font-size: 34px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--bone); font-weight: normal; margin-bottom: 4px;
    }
    .game-sub { color: var(--rust); letter-spacing: 0.14em; font-size: 12px; margin-bottom: 2.2rem; }
    .screen-heading {
      font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--bone); font-weight: normal; margin-bottom: 1.4rem;
    }
    .premise p { color: var(--ash); font-size: 14px; line-height: 1.75; margin-bottom: 1rem; max-width: 46rem; }
    .premise em { color: var(--bone); font-style: normal; }
    .how-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); gap: 1.4rem; }
    .how-item h3 {
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--moss); font-weight: normal; margin-bottom: 5px;
    }
    .how-item p { color: var(--ash); font-size: 12px; line-height: 1.65; }
    .pick-heading {
      font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--moss); font-weight: normal; margin: 1.8rem 0 0.7rem;
      border-bottom: 1px solid var(--rule); padding-bottom: 3px;
    }
    .pick-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    button.pick {
      display: flex; flex-direction: column; gap: 5px;
      background: #0a0c11; border: 1px solid var(--rule); border-radius: 2px;
      padding: 10px 12px; text-align: left; font: inherit; color: var(--bone);
      cursor: pointer; transition: border-color 0.08s, background 0.08s;
    }
    button.pick:hover { border-color: var(--iron); background: #0e1116; }
    button.pick.chosen { border-color: var(--ember); background: #14100c; }
    .pick-name { font-size: 14px; letter-spacing: 0.1em; }
    button.pick.chosen .pick-name { color: var(--ember); }
    .pick-role { color: var(--iron); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; }
    .pick-line { color: var(--ash); font-size: 11px; line-height: 1.5; }
    .pick-terms { list-style: none; color: var(--iron); font-size: 10px; line-height: 1.55; }
    .pick-terms li::before { content: '— '; color: #3a4048; }
    .pick-scores { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 2px; }
    .score { color: var(--iron); font-size: 10px; }
    .score b { color: var(--ash); font-weight: 600; }
    .score.best b { color: var(--bone); }
    .loadout-note { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; color: var(--iron); font-size: 11px; }
    .loadout-note b { color: var(--bone); }
    .loadout-dealt { color: #4a505c; font-size: 10.5px; margin-top: 8px; max-width: 42rem; line-height: 1.55; }
    .screen-actions { display: flex; align-items: center; gap: 10px; margin-top: 2.4rem; flex-wrap: wrap; }
    .screen-actions button {
      background: transparent; color: var(--ash); border: 1px solid var(--rule);
      padding: 8px 16px; font: inherit; font-size: 12px; cursor: pointer;
      letter-spacing: 0.1em; text-transform: uppercase; transition: all 0.08s;
    }
    .screen-actions button:hover { color: var(--bone); border-color: var(--iron); }
    .screen-actions button.primary { color: var(--ember); border-color: #4a3620; }
    .screen-actions button.primary:hover { border-color: var(--ember); background: #14100c; }
    .seed-field { margin-left: auto; color: var(--iron); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
    .seed-field input {
      background: #0b0d10; color: var(--ash); border: 1px solid var(--rule);
      padding: 6px 8px; font: inherit; font-size: 11px; margin-left: 8px; width: 11rem;
      text-transform: none; letter-spacing: 0;
    }
    .seed-field input:focus { outline: none; border-color: var(--ember); }

    /*
      Narrow windows tighten the columns and then fold them onto two rows. Nothing is
      ever hidden to make room -- the point of the layout is that the carried kit and the
      narration are both always on screen.
    */
    @media (max-width: 1280px) {
      #main-area { grid-template-columns: 260px minmax(0, 1fr) 210px 215px; }
      #map-container { height: 240px; }
    }
    @media (max-width: 1040px) {
      #main-area {
        grid-template-columns: 250px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1.4fr) minmax(0, 1fr);
        grid-template-areas:
          'left narrative'
          'actions character';
      }
      #left-column { grid-area: left; }
      #narrative-column { grid-area: narrative; }
      #action-panel { grid-area: actions; border-left: none; border-top: 1px solid var(--rule); }
      #character-panel { grid-area: character; border-top: 1px solid var(--rule); }
      #map-container { height: 190px; }
      .pick-row { grid-template-columns: 1fr; }
    }
  </style>

ld furrows under the turf. Someone ploughed this, and then did not come back to it.","A track through the grass, kept open by feet rather than by anybody’s intention."],[S.FOREST]:["The wood closes over you. The light goes green and then goes out.","Close timber, root-choked underfoot. You hear your own footfalls and nothing answering them.","Trees grown too near each other. Whatever path there was, the wood has taken back.","Deadfall and rot, and a silence that seems to be listening back.","Bark cut with marks at shoulder height, all the way in. Not a language you know.","The canopy shuts out the sky entirely. It could be any hour in here."],[S.HILLS]:["Broken hill country, all loose stone and dead thorn.","You work up a rise. Old walls run across the slope, laid by nobody living.","Hills, and the wind coming over them with nothing to break it.","A cairn on the crest, added to by every traveller who passed and had a stone.","Sheep country, without sheep. The folds are still standing and the gates are open."],[S.MOUNTAIN]:["Bare stone. The cold up here has a mineral taste to it.","You climb. There is nothing growing at this height and nothing has for a long time.","High rock, scoured clean. The world below looks like a map of itself.","Wind off the snowline, hard enough to lean into.","A pass, narrow enough that two men could hold it, and somebody clearly once did."],[S.SWAMP]:["Standing water the colour of tea. Each step takes something back.","Mire. The ground gives, holds, gives again. Things are trapped in it that you do not look at directly.","The mire stinks of iron and rot in equal measure.","Gas comes up in slow bubbles where you tread, and the smell follows you out.","Dead trees standing in the water, barkless, pale as bone."],[S.WATER]:["Black water, and no bottom you would care to find."]},bv={[Se.DAWN]:["Grey light. The night lets go of you reluctantly.","First light, thin as watered milk.","Birds start up, late and few, and stop again too soon.","The frost on your bedroll goes to water and finds its way in.","Dawn. Whatever kept pace with you in the night has business elsewhere now.","The east goes the colour of a healing bruise."],[Se.DAY]:["The light holds. It is not warmth, but it is something.","Full day. You make what distance you can while you can see.","Sun through cloud, without conviction. You walk.","Insects over the standing water. The day is the safest part and it is still not safe.","Nothing happens for hours, which is the best thing that can be said of it.","You eat on your feet and keep moving."],[Se.DUSK]:["The light is going. The mark at your throat has begun to itch.","Dusk. Shadows come out from under things and do not go back.","You start looking for somewhere with its back to a wall.","The birds go quiet all at once, the way they do when something moves through.","Last of the light on the high ground. Down here it is already gone.","You count what you are carrying, because after dark it is too late to find out."],[Se.NIGHT]:["Full dark. The weal on your throat is warm, and getting warmer.","Night. You can hear something keeping pace that stops when you stop.","The dark out here is not empty. It is occupied, and it is patient.","No moon. You go by feel and by the sound of your own footing.","Something laughs, a long way off, and it is not a bird.","The cold gets in under everything. There is nothing to do but keep walking.","Your fire is the only light in the world, and it tells everything exactly where you are."]},Jd=["Cold","Warm","Hot","Burning","Open"],_v=["The weal at your throat cools. For now.","The mark warms, the way skin warms under a held match.","The mark is hot. You can feel your own pulse in it.","The mark burns. Something out there has your direction now.","The mark splits and weeps. You are lit up like a signal fire to anything that eats."],Ev={[S.PLAINS]:[{message:"You turn up a stand of hedgerow berries the birds missed.",item:"wild_berries"},{message:"A hare, snared badly by :15,consumable:!1,tags:["resources_materials"]},bear_claw:{id:"bear_claw",name:"Bear Claw",category:x.MATERIAL,rarity:E.UNCOMMON,description:"Longer than your thumb. Whoever took it did not take the rest of the bear.",weight:.2,value:20,consumable:!1,tags:["resources_materials"]},bone:{id:"bone",name:"Animal Bone",category:x.MATERIAL,rarity:E.COMMON,description:"Long bone, cracked at one end. Bone takes an edge, if you have the patience.",weight:.5,value:3,consumable:!1,tags:["resources_materials"]},clay:{id:"clay",name:"Wet Clay",category:x.MATERIAL,rarity:E.COMMON,description:"Grey and heavy and still wet from the bank. It will be a pot or it will be nothing.",weight:4,value:3,consumable:!1,tags:["resources_materials"]},cloth:{id:"cloth",name:"Bolt of Cloth",category:x.MATERIAL,rarity:E.UNCOMMON,description:"Undyed linen, close-woven. Bandages, or a shirt, or a shroud.",weight:1,value:10,consumable:!1,tags:["resources_materials"]},feather:{id:"feather",name:"Feather",category:x.MATERIAL,rarity:E.COMMON,description:"A pinion feather off something large. Fletching, if you have the shafts.",weight:.1,value:2,consumable:!1,tags:["resources_materials"]},flour:{id:"flour",name:"Sack of Flour",category:x.MATERIAL,rarity:E.UNCOMMON,description:"Ground fine and only a little gritty. Flour is a village’s whole year in a sack.",weight:2,value:8,consumable:!1,tags:["resources_materials"]},fur:{id:"fur",name:"Animal Pelt",category:x.MATERIAL,rarity:E.UNCOMMON,description:"Scraped and drying, stiff at the edges. Warm, once it is worked soft.",weight:2,value:12,consumable:!1,tags:["resources_materials"]},grain:{id:"grain",name:"Sack of Grain",category:x.MATERIAL,rarity:E.UNCOMMON,description:"Barley, unmilled. Somebody was going to eat this through the winter.",weight:3,value:10,consumable:!1,tags:["resources_materials"]},herbs:{id:"herbs",name:"Medicinal Herbs",category:x.MATERIAL,rarity:E.UNCOMMON,description:"Whatever the hedgerow gave up that is worth drying.",weight:.1,value:8,consumable:!1,tags:["resources_materials"]},honey:{id:"honey",name:"Jar of Honey",category:x.MATERIAL,rarity:E.UNCOMMON,description:"Dark, and set solid with the comb still in it. It keeps forever and it closes wounds.",weight:.5,value:20,consumable:!1,tags:["resources_materials"]},iron_ingot:{id:"iron_ingot",name:"Iron Ingot",category:x.MATERIAL,rarity:E.RARE,description:"A bar of worked iron, heavier than it looks. This is what a blade is before it is a blade.",weight:1,value:30,consumable:!1,tags:["resources_materials"]},iron_ore:{id:"iron_ore",name:"Iron Ore",category:x.MATERIAL,rarity:E.UNCOMMON,description:"Rust-red rock, dense in the hand. Useless until somebody with a furnace wants it.",weight:3,value:10,consumable:!1,tags:["resources_materials"]},leather:{id:"leather",name:"Tanned Leather",category:x.MATERIAL,rarity:E.UNCOMMON,description:"Tanned, oiled, and cut square. Half the things a man wears out here start as this.",weight:1,value:15,consumable:!1,tags:["resources_materials"]},poison_herb:{id:"poison_herb",name:"Nightshade",category:x.MATERIAL,rarity:E.UNCOMMON,description:"Deadly nightshade. The berries look like fruit, which is the trouble.",weight:.1,value:20,consumable:!1,tags:["resources_materials"]},salt:{id:"salt",name:"Bag of Salt",category:x.MATERIAL,rarity:E.UNCOMMON,description:"Grey crystals, damp in the corners. Salt is what stands between a good year and a hungry one.",weight:.5,value:10,consumable:!1,tags:["resources_materials"]},sand:{id:"sand",name:"Bag of Sand",category:x.MATERIAL,rarity:E.COMMON,description:"Fine river sand, washed clean. Glass, or a scouring, or a grave marker.",weight:3,value:2,consumable:!1,tags:["resources_materials"]},stone:{id:"stone",name:"Cut Stone",category:x.MATERIAL,rarity:E.UNCOMMON,description:"Squared and dressed on four faces. Somebody cut this to build with and never built.",weight:4,value:6,consumable:!1,tags:["resources_materials"]},wax:{id:"wax",name:"Beeswax",category:x.MATERIAL,rarity:E.UNCOMMON,description:"A pale block that smells faintly of the hive. Candles, sealed jars, waxed thread.",weight:.3,value:10,consumable:!1,tags:["resources_materials"]},wolf_fang:{id:"wolf_fang",name:"Wolf Fang",category:x.MATERIAL,rarity:E.UNCOMMON,description:"Yellowed and worn at the tip. Old wolf. It got old by being careful.",weight:.1,value:8,consumable:!1,tags:["resources_materials"]},wood:{id:"wood",name:"Bundle of Wood",category:x.MATERIAL,rarity:E.COMMON,description:"Split and seasoned, tied with cord. Fire, or a handle, or a splint.",weight:3,value:3,consumable:!1,tags:["resources_materials"]},wool:{id:"wool",name:"Bundle of Wool",category:x.MATERIAL,rarity:E.UNCOMMON,description:"Raw fleece, still carrying the smell of the animal. It will be warm long before it is clean.",weight:1,value:8,consumable:!1,tags:["resources_materials"]},antidote:{id:"antidote",name:"Antidote",category:x.MEDICAL,rarity:E.RARE,description:"Rare herbs, carefully measured. Someone died learning the measure.",weight:.1,value:25,consumable:!0,uses:1,tags:["medical_supplies"]},bandage:{id:"bandage",name:"Clean Bandage",category:x.MEDICAL,rarity:E.COMMON,description:"Clean strips, boiled once. Worth more out here than silver.",weight:.1,value:3,consumable:!0,hp:12,uses:1,tags:["medical_supplies"]},burn_ointment:{id:"burn_ointment",name:"Burn Ointment",category:x.MEDICAL,rarity:E.UNCOMMON,description:"Rendered fat and something green, in a horn pot. For when the fire wins.",weight:.2,value:12,consumable:!0,hp:12,uses:2,tags:["medical_supplies"]},dirty_rag:{id:"dirty_rag",name:"Dirty Rag",category:x.MEDICAL,rarity:E.COMMON,description:"Not clean. You use it anyway, and hope.",weight:.1,value:1,consumable:!0,uses:1,tags:["medical_supplies"]},feverfew:{id:"feverfew",name:"Feverfew Herb",category:x.MEDICAL,rarity:E.UNCOMMON,description:"Small white flowers. The herbalists swear by it and they are mostly right.",weight:.1,value:8,consumable:!0,uses:1,tags:["medical_supplies"]},healing_salve:{id:"healing_salve",name:"Healing Salve",category:x.MEDICAL,rarity:E.UNCOMMON,description:"Rendered fat and something green. Expensive, and it works.",weight:.2,value:20,consumable:!0,hp:18,uses:3,tags:["medical_supplies"]},herbal_poultice:{id:"herbal_poultice",name:"Herbal Poultice",category:x.MEDICAL,rarity:E.UNCOMMON,description:"Mashed herbs bound under cloth. Draws the rot out if you are lucky.",weight:.2,value:10,consumable:!0,hp:25,uses:1,tags:["medical_supplies"]},needle_thread:{id:"needle_thread",name:"Needle & Thread",category:x.MEDICAL,rarity:E.UNCOMMON,description:"A bone needle and waxed gut. Mends cloth. Mends worse than cloth, if your hands are steady.",weight:.1,value:8,consumable:!0,uses:5,tags:["medical_supplies"]},painkiller:{id:"painkiller",name:"Painkiller Tincture",category:x.MEDICAL,rarity:E.UNCOMMON,description:"Willow bark steeped down to a bitter syrup. Takes the edge off. Takes the edge off your judgement too.",weight:.1,value:15,consumable:!0,uses:2,tags:["medical_supplies"]},splint:{id:"splint",name:"Wooden Splint",category:x.MEDICAL,rarity:E.UNCOMMON,description:"Two shaped staves and cord. For when the bone is wrong.",weight:.5,value:5,consumable:!0,uses:1,tags:["medical_supplies"]},makeshift_board:{id:"makeshift_board",name:"Makeshift Board",category:x.SHIELD,rarity:E.COMMON,description:"A plank with a strap nailed across it. Better than an open arm.",weight:1.5,value:2,consumable:!1,armor:.08,slot:he.OFFHAND,durability:20,tags:["shields"]},reinforced_shield:{id:"reinforced_shield",name:"Reinforced Shield",category:x.SHIELD,rarity:E.RARE,description:"Rimmed and bossed in iron. Built to be hit.",weight:5,value:30,consumable:!1,armor:.24,slot:he.OFFHAND,durability:110,tags:["shields"]},tower_shield:{id:"tower_shield",name:"Tower Shield",category:x.SHIELD,rarity:E.RARE,description:"A wall you have to carry. Slow, and almost unkillable behind.",weight:9,value:60,consumable:!1,armor:.32,slot:he.OFFHAND,durability:150,tags:["shields"]},wooden_shield:{id:"wooden_shield",name:"Wooden Shield",category:x.SHIELD,rarity:E.UNCOMMON,description:"Planks and a boss. It will take perhaps four good blows.",weight:3,value:10,consumable:!1,armor:.16,slot:he.OFFHAND,durability:70,tags:["shields"]},bedroll:{id:"bedroll",name:"Bedroll",category:x.SURVIVAL,rarity:E.UNCOMMON,description:"Canvas and straw ticking. Sleep off the wet ground is sleep you keep.",weight:1.5,value:15,consumable:!1,tags:["survival_gear"]},blanket:{id:"blanket",name:"Wool Blanket",category:x.SURVIVAL,rarity:E.UNCOMMON,description:"Coarse wool. It has somebody else's smell in it.",weight:1,value:8,consumable:!1,tags:["survival_gear"]},compass:{id:"compass",name:"Compass",category:x.SURVIVAL,rarity:E.RARE,description:"A lodestone needle floating on water in a turned box. Rare, and worth what it costs.",weight:.2,value:50,consumable:!1,tags:["survival_gear"]},map_fragment:{id:"map_fragment",name:"Map Fragment",category:x.SURVIVAL,rarity:E.RARE,description:"A corner torn off something larger, with three place names on it and part of a river.",weight:.1,value:25,consumable:!1,tags:["survival_gear"]},tent:{id:"tent",name:"Small Tent",category:x.SURVIVAL,rarity:E.RARE,description:"Oiled canvas and poles. Walls, of a sort.",weight:3,value:30,consumable:!1,tags:["survival_gear"]},bucket:{id:"bucket",name:"Wooden Bucket",category:x.TOOL,rarity:E.COMMON,description:"Staved and hooped, and it does not leak, which is more than most.",weight:1,value:4,consumable:!1,tags:["tools_utility"]},cooking_pot:{id:"cooking_pot",name:"Iron Cooking Pot",category:x.TOOL,rarity:E.UNCOMMON,description:"Blackened outside, scoured inside. Boiling is what makes bad water into water.",weight:2.5,value:15,consumable:!1,tags:["tools_utility"]},fishing_rod:{id:"fishing_rod",name:"Fishing Rod",category:x.TOOL,rarity:E.UNCOMMON,description:"Knotted cord, mended more than once. Set it right and the water feeds you.",weight:.5,value:10,consumable:!1,tags:["tools_utility"]},flint_steel:{id:"flint_steel",name:"Flint & Steel",category:x.TOOL,rarity:E.COMMON,description:"A wedge of flint and a struck steel, worn concave. Fire, given patience and dry tinder.",weight:.2,value:4,consumable:!1,tags:["tools_utility"]},grappling_hook:{id:"grappling_hook",name:"Grappling Hook",category:x.TOOL,rarity:E.UNCOMMON,description:"Three barbs forge-welded to a ring. It will hold a man, once, and you find out which time is the last.",weight:1,value:15,consumable:!1,tags:["tools_utility"]},hoe:{id:"hoe",name:"Farmer's Hoe",category:x.TOOL,rarity:E.UNCOMMON,description:"Worn to a shine at the shoulders. Turns earth, and has settled arguments.",weight:1.5,value:5,consumable:!1,durability:60,tags:["tools_utility"]},knife:{id:"knife",name:"Utility Knife",category:x.TOOL,rarity:E.UNCOMMON,description:"A working knife with a worn handle. Skins, cuts cord, eats. Not a weapon, but it has been.",weight:.3,value:5,consumable:!1,durability:80,tags:["tools_utility"]},lantern:{id:"lantern",name:"Oil Lantern",category:x.TOOL,rarity:E.UNCOMMON,description:"Shuttered horn and oil. The best light a walking man can carry.",weight:1,value:20,consumable:!1,durability:50,lightRadius:5,burnHours:12,tags:["light_sources","tools_utility"]},lockpick:{id:"lockpick",name:"Lockpick Set",category:x.TOOL,rarity:E.UNCOMMON,description:"A wrap of picks and a tension bar, all of them hand-filed. Owning these is itself a crime.",weight:.2,value:20,consumable:!1,durability:5,tags:["tools_utility"]},mortar_pestle:{id:"mortar_pestle",name:"Mortar & Pestle",category:x.TOOL,rarity:E.UNCOMMON,description:"Stone, stained green in the bowl by whatever was ground in it last.",weight:.8,value:12,consumable:!1,tags:["tools_utility"]},pickaxe:{id:"pickaxe",name:"Miner's Pickaxe",category:x.TOOL,rarity:E.UNCOMMON,description:"A miner’s tool with a hardened point. It goes through most things, given a swing.",weight:3,value:20,consumable:!1,durability:100,tags:["tools_utility"]},rope:{id:"rope",name:"Coil of Rope",category:x.TOOL,rarity:E.UNCOMMON,description:"Hemp, forty feet, laid and whipped at both ends. There is no such thing as too much rope.",weight:1.5,value:8,consumable:!1,tags:["tools_utility"]},sewing_kit:{id:"sewing_kit",name:"Sewing Kit",category:x.TOOL,rarity:E.UNCOMMON,description:"Needles, thread, a scrap of leather for patches. The difference between a coat and a rag.",weight:.3,value:10,consumable:!1,durability:10,tags:["tools_utility"]},shovel:{id:"shovel",name:"Wooden Shovel",category:x.TOOL,rarity:E.UNCOMMON,description:"Iron-shod blade on an ash haft. Digs, buries, and at a pinch swings.",weight:2,value:8,consumable:!1,durability:80,tags:["tools_utility"]},tinderbox:{id:"tinderbox",name:"Tinderbox",category:x.TOOL,rarity:E.UNCOMMON,description:"Char cloth, flint and steel in a tin that shuts tight. Dry tinder is worth more than gold in the wet.",weight:.3,value:5,consumable:!1,tags:["tools_utility"]},ancient_coin:{id:"ancient_coin",name:"Ancient Coin",category:x.VALUABLE,rarity:E.RARE,description:"Older than the Church, by the look of the face on it. Thin as a fingernail, green with age.",weight:.1,value:50,consumable:!1,tags:["valuables_currency"]},copper_coins:{id:"copper_coins",name:"Copper Coins (10)",category:x.VALUABLE,rarity:E.UNCOMMON,description:"Thin copper, clipped at the edges. What most things actually cost.",weight:.1,value:10,consumable:!1,tags:["valuables_currency"]},dye_plant:{id:"dye_plant",name:"Woad Plant",category:x.VALUABLE,rarity:E.UNCOMMON,description:"Woad, cut and bundled. Blue, eventually, and a great deal of work in between.",weight:.2,value:8,consumable:!1,tags:["valuables_currency"]},gemstone:{id:"gemstone",name:"Uncut Gemstone",category:x.VALUABLE,rarity:E.RARE,description:"Rough, cloudy, and clearly worth something to somebody who cuts stones.",weight:.1,value:80,consumable:!1,tags:["valuables_currency"]},gold_coins:{id:"gold_coins",name:"Gold Coins (10)",category:x.VALUABLE,rarity:E.ARTIFACT,description:"Gold. Out here it is worth exactly what someone will trade for it, which is often nothing.",weight:.1,value:100,consumable:!1,tags:["valuables_currency"]},gold_ring:{id:"gold_ring",name:"Gold Ring",category:x.VALUABLE,rarity:E.RARE,description:"Plain gold, worn thin on one side. Somebody wore this for forty years.",weight:.1,value:70,consumable:!1,tags:["valuables_currency"]},silver_coins:{id:"silver_coins",name:"Silver Coins (10)",category:x.VALUABLE,rarity:E.RARE,description:"Silver, and enough of it to be noticed carrying.",weight:.1,value:50,consumable:!1,tags:["valuables_currency"]},silver_necklace:{id:"silver_necklace",name:"Silver Necklace",category:x.VALUABLE,rarity:E.RARE,description:"Fine links and a small clasp, tarnished dark. Too good for anybody out here.",weight:.2,value:40,consumable:!1,tags:["valuables_currency"]},silver_ring:{id:"silver_ring",name:"Silver Ring",category:x.VALUABLE,rarity:E.RARE,description:"Silver, with an inscription inside that has worn to nothing.",weight:.1,value:25,consumable:!1,tags:["valuables_currency"]},spices:{id:"spices",name:"Pouch of Spices",category:x.VALUABLE,rarity:E.RARE,description:"Pepper and something warmer, in a folded cloth. Worth more by weight than the man carrying it.",weight:.3,value:35,consumable:!1,tags:["valuables_currency"]},trade_goods:{id:"trade_goods",name:"Bundle of Trade Goods",category:x.VALUABLE,rarity:E.RARE,description:"Odds bundled for barter: cord, buttons, a little salt, a knife blade with no handle.",weight:2,value:25,consumable:!1,tags:["valuables_currency"]},blacksmith_hammer:{id:"blacksmith_hammer",name:"Blacksmith's Hammer",category:x.WEAPON_BLUNT,rarity:E.UNCOMMON,description:"Dead weight on a long haft. Armour does not stop a blow like this, it only spreads it.",weight:2,value:18,consumable:!1,damage:10.2,sourceDice:"1d8",durability:120,tags:["blunt_weapons"]},hammer:{id:"hammer",name:"Carpenter's Hammer",category:x.WEAPON_BLUNT,rarity:E.UNCOMMON,description:"A joiner’s hammer, heavy in the head. Meant for pegs, and it does not mind.",weight:1,value:8,consumable:!1,damage:8.6,sourceDice:"1d6",durability:100,tags:["blunt_weapons","tools_utility"]},mace:{id:"mace",name:"Flanged Mace",category:x.WEAPON_BLUNT,rarity:E.RARE,description:"Flanged iron on a haft. Made specifically for people wearing armour.",weight:2.5,value:40,consumable:!1,damage:10.2,sourceDice:"1d8",durability:120,tags:["blunt_weapons"]},quarterstaff:{id:"quarterstaff",name:"Quarterstaff",category:x.WEAPON_BLUNT,rarity:E.COMMON,description:"A staff the height of a man. Keeps things further off than a blade does.",weight:1.5,value:4,consumable:!1,damage:8.6,sourceDice:"1d6",durability:80,tags:["blunt_weapons"]},sledgehammer:{id:"sledgehammer",name:"Sledgehammer",category:x.WEAPON_BLUNT,rarity:E.RARE,description:"Two-handed and enormously slow. If it connects, once is enough.",weight:4.5,value:25,consumable:!1,damage:14.2,sourceDice:"2d6",durability:100,tags:["blunt_weapons"]},stone_hatchet:{id:"stone_hatchet",name:"Stone Hatchet",category:x.WEAPON_BLUNT,rarity:E.COMMON,description:"A knapped head lashed to a haft. It will take a limb off a tree, or come apart trying.",weight:1.2,value:4,consumable:!1,damage:8.6,sourceDice:"1d6",durability:30,tags:["blunt_weapons"]},walking_stick:{id:"walking_stick",name:"Walking Stick",category:x.WEAPON_BLUNT,rarity:E.COMMON,description:"Takes weight off the road, and settles arguments at a distance.",weight:.8,value:2,consumable:!1,damage:7,sourceDice:"1d4",durability:60,tags:["blunt_weapons"]},warhammer:{id:"warhammer",name:"Warhammer",category:x.WEAPON_BLUNT,rarity:E.RARE,description:"Military iron. It does not cut through mail; it caves in what is underneath.",weight:3,value:60,consumable:!1,damage:11.8,sourceDice:"1d10",durability:130,tags:["blunt_weapons"]},wooden_club:{id:"wooden_club",name:"Wooden Club",category:x.WEAPON_BLUNT,rarity:E.COMMON,description:"A shaped length of hardwood. Crude, and entirely sufficient.",weight:1.2,value:2,consumable:!1,damage:8.6 ged_weapons"]},hunting_bow:{id:"hunting_bow",name:"Hunting Bow",category:x.WEAPON_RANGED,rarity:E.RARE,description:"A working bow, drawn smooth by long use. Made for deer and perfectly happy with worse.",weight:1.5,value:30,consumable:!1,damage:8.6,sourceDice:"1d6",durability:100,tags:["ranged_weapons"]},javelin:{id:"javelin",name:"Hunting Javelin",category:x.WEAPON_RANGED,rarity:E.UNCOMMON,description:"Fire-hardened point on a light shaft. Thrown, and then gone, unless you go and get it.",weight:1.5,value:12,consumable:!1,damage:8.6,sourceDice:"1d6",durability:60,tags:["ranged_weapons"]},short_bow:{id:"short_bow",name:"Short Bow",category:x.WEAPON_RANGED,rarity:E.UNCOMMON,description:"Short in the limb, quick to draw, and honest about its range.",weight:1,value:20,consumable:!1,damage:8.6,sourceDice:"1d6",durability:80,tags:["ranged_weapons"]},sling:{id:"sling",name:"Leather Sling",category:x.WEAPON_RANGED,rarity:E.UNCOMMON,description:"A leather cradle and two cords. Older than swords, and it still kills.",weight:.3,value:5,consumable:!1,damage:7,sourceDice:"1d4",durability:60,tags:["ranged_weapons"]},throwing_stones:{id:"throwing_stones",name:"Bag of Stones",category:x.WEAPON_RANGED,rarity:E.COMMON,description:"River pebbles, chosen for weight and roundness. The ammunition the ground gives you free.",weight:.5,value:1,consumable:!1,damage:6.2,sourceDice:"1d3",durability:30,tags:["ranged_weapons"]}},sw=[x.WEAPON_EDGED,x.WEAPON_BLUNT,x.WEAPON_RANGED];function Ee(i){return wn[i]}function uf(i){return sw.includes(i.category)}function df(i){return i.slot!==void 0||uf(i)}function ff(i){return i.slot?i.slot:uf(i)?he.HAND:void 0}function pf(i){var t;let e=0;for(const r of Object.keys(i.items))e+=(((t=Ee(r))==null?void 0:t.weight)??0)*i.items[r];return e}function ow(i){return Math.max(0,jd-pf(i))}function yt(i,e,t=1){var o;if(t<=0)return 0;const r=aw[e];if(r!==void 0)return i.copper+=r*t,t;const n=((o=Ee(e))==null?void 0:o.weight)??0;let s=t;if(n>0){const a=Math.floor(ow( et. Yet is doing a lot of work in that sentence.","You keep touching the weal. You have not noticed that you do it.","Somewhere behind you a dog has started barking and has not stopped."],2:["You did this on the third day too. It did not help then.","It is patient in a way you have not earned.","They will not take you in. You know why.","The rope was not the sentence. The rope was the paperwork.","You are being spent, a day at a time, and you can feel the rate.","Somebody is keeping an account of this. Not you.","You are thinner than you were at the tree. It has been measuring.","Every road out of here goes back to it. You have not tested that. It has.","You sleep badly and wake owing more than you did.","It could have taken you on the first night. Ask yourself why it did not.","You are good at this. That is the part it likes."],3:["You are alone out here. (You are not alone out here.)","Nothing happened. Nothing is happening. Nothing will have happened.","That was not the sound you heard. You heard your own name.","It is behind you. It is ahead of you. It is the same thing and it is waiting.","You should sit down. You have been walking since they cut you loose and you should sit down.","The debt does not compound. It simply never stops.","Your hands are steady. Your hands are not steady. Both of these are true.","Turn around. Do not turn around.","The country ahead of you is the country behind you. You have walked this stretch four times.","You have been talking out loud for the last hour. Some of it was not you.","There is a word for what you are now and you will not like learning it."],4:["Come back to the tree. It is the only honest thing left in the Thornmarch.","There is no south. There is only the walk, and the walk goes one way.","Say the name you were hanged under. Say it. It is the only word that still works.","Everyone you have met on this road has been the same person.","You were not cut down. You are still up there. This is what it looks like from up there.","There is no debt. There never was. Keep walking and see what happens.","The tree has been moving. It is closer than the weal is telling you.","Your daughter is not south. There is no south. We have discussed this.","Lie down. It will be over in an hour and nothing after that will hurt.","Everything you have eaten since the tree, it gave you.","They are all still hanging. You are the only one who came down and that was the mistake."]},cw=[i=>`"${i.origin.line}" It has heard you say it. It did not believe you either.`,i=>`"${i.goal.line}" Say it again. It sounds thinner every time.`,i=>`"${i.bond.line}" That is the part it will use, when it comes to it.`,()=>"It knows what you were hanged for. It was there. It is the only one who was.",i=>`${i.flaw.name}. It has been counting on that.`],uw=["Nothing comes of it. The hour passes and the country is exactly as it was.","You find the road again, and for a while it is easy going.","It is quiet. It has been quiet for days now, and you are starting to trust it.","Whatever it was has gone off in the other direction. You are sure of that.","You are making better time than you thought. Another day, perhaps two.","You have not been followed once since the tree. Not once.","The water here is clean. Drink it.","That was days ago now. You are past it.","Nobody saw you. Nobody is looking.","There is nothing behind you. You have checked, and there is nothing behind you."];function dw(i){const e=i.entities.getComponent(i.playerId,"mark"),t=i.entities.getComponent(i.playerId,"stats");let r=e?At(e.intensity):0;return t&&t.maxHp>0&&t.hp/t.maxHp<=.25&&(r+=1),Math.max(0,Math.min(4,r))}function Ye(i,e,t={}){const r=dw(i),n=t.mechanical??"";if(r===0)return{text:Kn(e,n),register:r,unreliable:!1};const s=Number(i.lastDraw[xc]??Number.NEGATIVE_INFINITY),o=i.tick-s>=Ry;if(t.allowLies!==!1&&r>=Sy&&o&&i.rng.nextFloat()<Cy){const d=_r(uw,i.rng,i.lastDraw,"narrator:lie",f=>f);return i.lastDraw[xc]=String(i.tick),{text:Kn(d,n),register:r,unrel fore you look at me like that -- iron. Bring me anything worked and I will make you something that holds an edge.",task:i=>`Bring worked metal out of the barrows in ${i}`,cost:"He melted down the chapel hinges instead. The parish has not forgiven him and neither has he.",reward:{items:{hunting_knife:1,copper_coins:3}}},{kind:"fetch",item:"firewood",terrain:S.FOREST,days:4,ask:()=>"My fire has been cold nine days and nobody will go into the wood for me. Bring me what will burn and I will put an edge on anything you carry.",task:i=>`Bring cut wood from ${i}`,cost:"The forge stayed cold. He has started talking about going south with the rest of them.",reward:{items:{iron_knife:1,copper_coins:2}}}],[ee.PRIEST]:[{kind:"fetch",item:"feverfew",terrain:S.SWAMP,days:4,ask:()=>"Half this parish is sweating through a fever I have no name for and the Church has sent nothing but a letter. Feverfew, out of the sour ground. As much as you can carry.",task:i=>`Bring feverfew out of ${i}`,cost:"It went through the houses on the north side and took the old first, as it does.",reward:{items:{herbal_poultice:2},knowledge:!0}},{kind:"find",days:5,ask:()=>"A man of this parish went out to the stones and did not come back. Somebody should say the words over him. It will not be me; I have not been past the gate since the winter.",task:i=>`Find what is left of him out in ${i}, and do it properly`,cost:"Nobody went. Whatever is out there is still out there, and the parish knows it.",reward:{knowledge:!0}}],[ee.REEVE]:[{kind:"find",days:5,ask:()=>"Two of mine went out to bring the flock down nine days ago. I have sent nobody after them because I have nobody to send. Go and find out, and come back and tell me either way.",task:i=>`Find out what became of them out in ${i}`,cost:"Whatever happened out there happened without anybody watching, and the reeve has stopped going as far as the gate.",reward:{items:{copper_coins:3,dried_meat:1},knowledge:!0}},{kind:"clear",days:4,ask:()=>"Something has
