<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EndlessQuest</title>
  <style>
    /*
      Chrome for a glyph-grid roguelike. The reference games are dense, monospaced, and
      unapologetically textual; the departure here is the palette, which is ink on
      near-black rather than the sixteen DOS colours, and bars drawn as glyph runs
      rather than as CSS fills.
    */
    :root {
      --void: #05060a;
      --panel: #0a0c11;
      --rule: #1c2028;
      --bone: #d8d0c0;
      --ash: #8a857c;
      --iron: #5f6670;
      --moss: #6b7a4a;
      --rust: #8a5a3c;
      --ember: #c8752c;
      --blood: #8c2f2f;
      --pale: #b6c2c9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--void);
      color: var(--bone);
      font-family: Consolas, "DejaVu Sans Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.35;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: none;
    }
    #status-bar {
      background: var(--panel);
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: stretch;
      gap: 18px;
      padding: 6px 12px;
      font-size: 12px;
      white-space: nowrap;
      overflow-x: auto;
    }
    #main-area { flex: 1; display: flex; overflow: hidden; }
    #map-container { flex: 1; position: relative; background: var(--void); overflow: hidden; }
    #chart-overlay {
      position: absolute; inset: 0; z-index: 20;
      background: rgba(4, 5, 7, 0.94);
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; padding: 14px; overflow: auto; cursor: pointer;
    }
    #chart-overlay[hidden] { display: none; }
    #chart-overlay h3 { margin: 0; color: var(--bone); letter-spacing: 0.14em; text-transform: uppercase; font-size: 11px; }
    #chart-overlay canvas { image-rendering: pixelated; border: 1px solid #1c2028; max-width: 100%; }
    .chart-legend { display: flex; flex-direction: column; gap: 2px; text-align: center; }
    .chart-place { margin: 0; color: var(--bone); font-size: 11px; }
    #action-panel {
      width: 268px;
      background: var(--panel);
      border-left: 1px solid var(--rule);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
    }
    #action-panel h3 {
      font-size: 11px;
      font-weight: normal;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--moss);
      margin: 10px 0 3px;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 2px;
    }
    #action-panel h3:first-child { margin-top: 0; }
    #action-panel h3.panel-danger { color: var(--blood); }
    #action-panel h3.panel-dead { color: #5e1616; }
    #speak {
      width: 100%; box-sizing: border-box;
      background: #0b0d10; color: var(--bone);
      border: 1px solid #2a2f38; border-radius: 2px;
      padding: 6px 8px; font: inherit; font-size: 12px;
    }
    #speak::placeholder { color: #4a505c; }
    #repertoire { margin-top: 4px; }
    #repertoire summary {
      cursor: pointer; color: var(--iron); font-size: 9.5px;
      letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 0;
    }
    #repertoire summary:hover { color: var(--bone); }
    .verb-group { display: flex; flex-wrap: wrap; gap: 3px; align-items: baseline; margin-bottom: 3px; }
    .verb-group-label {
      color: #4a505c; font-size: 9px; text-transform: uppercase;
      letter-spacing: 0.1em; width: 100%; margin-top: 3px;
    }
    button.verb {
      background: #101318; color: var(--ash, #8a857c);
      border: 1px solid #23272f; border-radius: 2px;
      padding: 2px 6px; font: inherit; font-size: 10.5px; cursor: pointer;
      width: auto; margin: 0;
    }
    .errand { display: flex; flex-direction: column; gap: 1px; margin-bottom: 5px; }
    .errand-task { color: var(--bone); font-size: 11.5px; }
    .errand-who { color: var(--iron); font-size: 9.5px; }
    .errand.urgent .errand-task { color: var(--ember); }
    .person { display: flex; flex-direction: column; gap: 1px; margin-bottom: 4px; }
    .person-name { color: var(--bone); font-size: 11.5px; }
    .person-note { color: var(--iron); font-size: 9.5px; }
    .person-ideal { color: var(--bile, #7a7040); font-size: 9.5px; font-style: italic; }
    button.verb:hover { color: var(--bone); border-color: var(--ember); background: #161a20; }
    #speak:focus { outline: none; border-color: var(--ember); }
    #log-panel .log-entry.said { color: var(--pale, #b6c2c9); font-weight: bold; }
    #action-panel h3.panel-won  { color: #b8a878; }
    #action-panel button {
      background: transparent;
      color: var(--bone);
      border: 1px solid var(--rule);
      padding: 4px 7px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      text-align: left;
      transition: background 0.08s, border-color 0.08s;
    }
    #action-panel button:hover:not(:disabled) {
      background: #141821;
      border-color: var(--moss);
      color: #fff;
    }
    #action-panel button:disabled { opacity: 0.32; cursor: not-allowed; }
    #action-panel .panel-note {
      font-size: 11px;
      color: var(--ash);
      margin: 1px 0 4px;
    }
    #movement-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      margin-bottom: 6px;
    }
    #movement-grid button { aspect-ratio: 1; text-align: center; padding: 0; font-size: 13px; }
    #log-panel {
      height: 172px;
      background: var(--panel);
      border-top: 1px solid var(--rule);
      padding: 6px 10px;
      overflow-y: auto;
      font-size: 12.5px;
    }
    #log-panel .log-entry { padding: 1px 0; }
    #log-panel .log-entry.movement { color: var(--ash); }
    #log-panel .log-entry.system   { color: var(--pale); }
    #log-panel .log-entry.search   { color: var(--moss); }
    #log-panel .log-entry.rest     { color: var(--iron); }
    #log-panel .log-entry.combat   { color: var(--ember); }
    #log-panel .log-entry.danger   { color: var(--blood); }
    #log-panel .log-entry.death    { color: #ff4d4d; font-weight: bold; }
    #log-panel .log-entry.error    { color: var(--rust); }

    /* Status bar: label above a glyph-run bar, after the reference games' readouts. */
    .status-item { display: flex; flex-direction: column; gap: 1px; }
    .status-label {
      font-size: 9.5px;
      letter-spacing: 0.12em;
      color: var(--iron);
      text-transform: uppercase;
    }
    .status-value { color: var(--bone); }
    .status-sub { font-size: 9.5px; color: var(--iron); text-transform: capitalize; }
    .meter { letter-spacing: -1px; }
    .meter .full { color: currentColor; }
    .meter .empty { color: #22262e; }
    .meter.hp     { color: var(--blood); }
    .meter.hunger { color: var(--rust); }
    .meter.thirst { color: #3d6b8a; }
    .meter.fatigue{ color: #6a5a80; }
    .meter.mark   { color: var(--ember); }
    .meter.exhaustion { color: var(--rust); }

    .abilities .status-value { display: flex; gap: 8px; flex-wrap: wrap; }
    .ability { color: var(--iron); white-space: nowrap; }
    .ability b { color: var(--bone); font-weight: 600; }
    .threat-glyph { font-weight: bold; font-size: 15px; }
    .mark-value.band-0 { color: var(--iron); }
    .mark-value.band-1 { color: var(--bile, #7a7040); }
    .mark-value.band-2 { color: var(--rust); }
    .mark-value.band-3 { color: var(--blood); }
    .mark-value.band-4 { color: #ff2d2d; text-shadow: 0 0 7px #ff2d2d; }
  </style>

a mouth."],kg=["The weal closes. Not fades -- closes, the way a wound closes, leaving the white line of itself behind.","Whatever was owed here has been paid, or refused, and the difference stopped mattering some time ago.","You walk out of the Thornmarch. The road south is only a road, and you are on it, and nothing is following."],Rg=["The rope does not need to be put round you. You have been wearing it since the day they cut you down.","It collects what it is owed. It takes its time about it."];var Ue=(i=>(i.DAWN="dawn",i.DAY="day",i.DUSK="dusk",i.NIGHT="night",i))(Ue||{});function ir(i){const e=(i%$e+$e)%$e;return e>=Jp&&e<Xh?"dawn":e>=Xh&&e<zh?"day":e>=zh&&e<em?"dusk":"night"}function Hu(i){return i==="dawn"||i==="day"}function Wu(i){const e=Math.floor((i-1)/yh)%Iu;return Ag[e]}function mn(i){switch(ir(i)){case"day":return Su;case"dawn":case"dusk":return Cu;case"night":default:return ku}}function ei(i,e,t,r,s){if(i.length===0)throw new Error(`Cannot draw from the empty table "${r}"`);if(i.length===1)return i[0];let n=i[e.nextInt(0,i.length-1)];return s(n)===t[r]&&(n=i[e.nextInt(0,i.length-1)]),t[r]=s(n),n}function er(i,e){return i[e.nextInt(0,i.length-1)]}function Le(i){return i.length===0?i:i.charAt(0).toUpperCase()+i.slice(1)}const sr={[P.PLAINS]:"open grass",[P.FOREST]:"close wood",[P.HILLS]:"broken hill country",[P.MOUNTAIN]:"bare stone",[P.WATER]:"black water",[P.SWAMP]:"standing mire"},Mg={[P.PLAINS]:["You come out into open grass. Nothing can hide here, which cuts both ways.","Flat country, waist-high and going to seed. Someone stopped cutting it years ago.","Open ground. You can see a long way, and be seen the same distance.","Grass to the horizon, bent all one way by a wind that has not stopped in days.","Old furrows under the turf. Someone ploughed this, and then did not come back to it.","A track through the grass, kept open by feet rather than by anybody’s intention."],[P.FOREST]:["The wood closes over you. The light goes green and then goes out.","Close timber, root-choked underfoot. You hear your own footfalls and nothing answering them.","Trees grown too near each other. Whatever path there was, the wood has taken back.","Deadfall and rot, and a silence that seems to be listening back.","Bark cut with marks at shoulder height, all the way in. Not a language you know.","The canopy shuts out the sky entirely. It could be any hour in here."],[P.HILLS]:["Broken hill country, all loose stone and dead thorn.","You work up a rise. Old walls run across the slope, laid by nobody living.","Hills, and the wind coming over them with nothing to break it.","A cairn on the crest, added to by every traveller who passed and had a stone.","Sheep country, without sheep. The folds are still standing and the gates are open."],[P.MOUNTAIN]:["Bare stone. The cold up here has a mineral taste to it.","You climb. There is nothing growing at this height and nothing has for a long time.","High rock, scoured clean. The world below looks like a map of itself.","Wind off the snowline, hard enough to lean into.","A pass, narrow enough that two men could hold it, and somebody clearly once did."],[P.SWAMP]:["Standing water the colour of tea. Each step takes something back.","Mire. The ground gives, holds, gives again. Things are trapped in it that you do not look at directly.","The mire stinks of iron and rot in equal measure.","Gas comes up in slow bubbles where you tread, and the smell follows you out.","Dead trees standing in the water, barkless, pale as bone."],[P.WATER]:["Black water, and no bottom you would care to find."]},Og={[Ue.DAWN]:["Grey light. The night lets go of you reluctantly.","First light, thin as watered milk.","Birds start up, late and few, and stop again too soon.","The frost on your bedroll goes to water and finds its way in.","Dawn. Whatever kept pace with you in the night has business elsewhere now.","The east goes the colour of a healing bruise."],[Ue.DAY]:["The light holds. It is not warmth, but it is something.","Full day. You make what distance you can while you can see.","Sun through cloud, without conviction. You walk.","Insects over the standing water. The day is the safest part and it is still not safe.","Nothing happens for hours, which is the best thing that can be said of it.","You eat on your feet and keep moving."],[Ue.DUSK]:["The light is going. The mark at your throat has begun to itch.","Dusk. Shadows come out from under things and do not go back.","You start looking for somewhere with its back to a wall.","The birds go quiet all at once, the way they do when something moves through.","Last of the light on the high ground. Down here it is already gone.","You count what you are carrying, because after dark it is too late to find out."],[Ue.NIGHT]:["Full dark. The weal on your throat is warm, and getting warmer.","Night. You can hear something keeping pace that stops when you stop.","The dark out here is not empty. It is occupied, and it is patient.","No moon. You go by feel and by the sound of your own footing.","Something laughs, a long way off, and it is not a bird.","The cold gets in under everything. There is nothing to do but keep walking.","Your fire is the only light in the world, and it tells everything exactly where you are."]},Vu=["Cold","Warm","Hot","Burning","Open"],Pg=["The weal at your throat cools. For now.","The mark warms, the way skin warms under a held match.","The mark is hot. You can feel your own pulse in it.","The mark burns. Something out there has your direction now.","The mark splits and weeps. You are lit up like a signal fire to anything that eats."],Ng={[P.PLAINS]:[{message:"You turn up a stand of hedgerow berries the birds missed.",item:"wild_berries"},{message:"A hare, snared badly by someone who never came back for it. Still good.",item:"raw_meat"},{message:"Rainwater held in a stone trough. You fill what you have.",item:"waterskin"},{message:"A field gone to seed, and a sickle left in it. The handle is still sound.",item:"sickle"},{message:"Windfall apples under a tree nobody owns any more.",item:"apple"},{message:"A crock in the ruin of a steading, sealed, and the seal is good.",item:"honey"},{message:"Someone’s snare-line, and someone’s knife left beside it.",item:"hunting_knife"},{message:"Cart-spill in the ruts: a loaf, gone hard, still bread.",item:"stale_bread"},{message:"You walk the whole field and put up nothing but crows.",item:null}],[P.FOREST]:[{message:"Mushrooms at the foot of a dead ash. You know these ones.",item:"mushroom"},{message:"A snare-line, old but intact. Something is in the third one.",item:"raw_meat"},{message:"A seep running off the rocks, thin and cold.",item:"waterskin"},{message:"A charcoal-burner’s camp, long cold. Someone left in a hurry and left this.",item:"bandage"},{message:"Firewood, already cut and bundled, and nobody has come back for it.",item:"firewood"},{message:"A fallen nest, and eggs in it that the cold has kept.",item:"apple"},{message:"Fungus off the north face of an oak, dry enough to take a spark.",item:"tinderbox"},{message:"Rope, coiled at the foot of a tree, cut at one end. You do not look up.",item:"rope"},{message:"Herbs growing where the light gets in, and you know two of the three.",item:"herbs"},{message:"The wood gives you nothing but the sense of being further in than you were.",item:null}],[P.HILLS]:[{message:"Hard little sloes off a thorn. They set your teeth on edge but they are food.",item:"wild_berries"},{message:"A spring coming up through the scree.",item:"waterskin"},{message:"A cairn, opened. Whoever did it left the coin and took everything else.",item:"ancient_coin"},{message:"A shepherd’s crook, or what is left of one. It takes weight off the road.",item:"walking_stick"},{message:"A drystone fold with a store dug under it: salt, and not much else.",item:"salt"},{message:"A ewe dead a day, no more. You take what will keep.",item:"raw_meat"},{message:"Flint in the scree, the good kind, ready to strike.",item:"flint_steel"
